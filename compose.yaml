services:
  server:
    build:
      context: ./ts-api
    env_file: .env
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm start
    develop:
      watch:
        - action: sync
          path: ./ts-api/src
          target: /usr/src/app/src

        - action: rebuild
          path: ./ts-api/package.json

        - action: rebuild
          path: ./ts-api/tsconfig.json
  db:
    image: postgres
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file: .env
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis
    ports:
      - 6379:6379
volumes:
  db-data:


